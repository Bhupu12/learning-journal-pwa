<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reflective Journal</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

  <!-- Theme color -->
  <meta name="theme-color" content="#2b6cb0">

  <!-- Icons -->
  <link rel="icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Main JS -->
  <script src="{{ url_for('static', filename='js/form4JS.js') }}"></script>
</head>

<body onload="init()">

  <!-- Offline banner -->
  <div id="offline-banner" class="offline-banner">
    ⚠️ You are offline — changes may not save.
  </div>

  <!-- HERO SECTION -->
  <section class="hero hero-bg">
    <div class="hero-overlay"></div>

    <div class="hero-content container">
      <h1 class="hero-title">Reflective Journal</h1>
      <p class="hero-subtitle">
        Write your weekly reflection and keep track of your learning journey.
      </p>

      <a class="btn primary" href="/todo">📝 Open Study Planner (To-Do)</a>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="container content-wrap">

    <p id="todayDate" class="today-date"></p>

    <div class="card">
      <form name="myForm" onsubmit="return checkReflection()">
        <label for="fname">Name:</label><br>
        <input type="text" id="fname" name="fname" required><br><br>

        <label for="reflection">Reflection:</label><br>
        <textarea id="reflection" name="reflection" minlength="10"
          placeholder="What did you learn this week? What did you find challenging?"
          rows="4" required></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset"><br><br>
      </form>
    </div>

    <h2 class="section-title">Search Reflections</h2>
    <input type="text" id="searchBar" placeholder="Search reflections..."
           onkeyup="searchReflections()" class="search-input"><br><br>

    <h2 class="section-title">Previous Reflections</h2>
    <div id="viewAll" class="card"></div>

  </main>

  <!-- Register Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then(() => console.log("Service Worker registered"))
          .catch(err => console.log("SW error:", err));
      });
    }
  </script>

</body>
</html>
